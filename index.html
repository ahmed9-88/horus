<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14295a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>حورس</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Cairo:wght@400;600;700&display=swap");
:root{--teal:#1f8a8a;--lapis:#14295a;--gold:#c9973a;--sand:#f4e9d0;--ink:#14213d;--card:#fffaf0;--mut:#6a6455;--line:#e3d3a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--sand);color:var(--ink);max-width:560px;margin-inline:auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--lapis);color:#fff;padding:8px 16px 12px;display:flex;align-items:center;gap:12px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,var(--lapis) 12px 16px,var(--teal) 16px 28px,var(--lapis) 28px 32px)}
header img{width:40px;height:40px;border-radius:10px}
header h1{margin:0;font-family:"Reem Kufi",Cairo,sans-serif;font-size:30px;color:var(--gold);letter-spacing:1px}header small{color:#e8d9ae;display:block;font-size:11px;margin-top:-4px}
button{font:inherit;cursor:pointer;border:0}main{padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#0f8f8a,var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.nm{font-weight:700}.sub{color:var(--mut);font-size:12px}.txt{margin:10px 0;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.acts button{flex:1;background:none;color:var(--mut);padding:8px;font-size:14px;border-radius:10px}.acts .on{color:#c0392b;font-weight:700}
textarea,input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:10px}
.btn{background:var(--lapis);border-bottom:3px solid var(--gold);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;min-height:44px}
.link{background:none;color:var(--teal);text-decoration:underline}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin-inline:auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:10px 0;color:var(--mut)}nav .on{color:var(--lapis);border-top:3px solid var(--gold);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:99px;white-space:nowrap}.chip.on{background:var(--lapis);color:var(--gold);border-color:var(--gold)}
.cm{background:var(--sand);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:14px}
.tag{background:#d9a44122;border-radius:8px;padding:1px 8px;font-size:12px}.err{color:#c0392b;font-size:13px}
.pat{height:10px;margin:10px 0;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 16px,var(--teal) 16px 28px,transparent 28px 32px)}
</style></head>
<body><header><img src="icon.svg" alt=""><div><h1>حورس</h1><small>عين مصر على صحابها</small></div></header><main id="app"></main><nav id="nav" hidden></nav>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://lbfkwuwubpftqmnyyjtr.supabase.co";
const SUPABASE_KEY = "sb_publishable_IRKp4IZpxAMKFRDzIKP3Cg_dnZwzRcW";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const ROOMS=["الكل","كورة ⚽","سينما وفن 🎬","أكل مصري 🍲","نكت 😂","صعيدي 🌾","شغل ومشاريع 💼"];
const GOVS=["القاهرة","الجيزة","الإسكندرية","سوهاج","أسيوط","المنيا","الأقصر","أسوان","الدقهلية","الشرقية","الغربية","المنوفية","بورسعيد","السويس","أخرى"];
const $=s=>document.querySelector(s), app=$("#app"), nav=$("#nav");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mail=h=>h+"@horus-eg.com";
let me=null,tab="home",room="الكل",mode="in",msg="";
function ago(t){const m=Math.floor((Date.now()-new Date(t))/6e4);if(m<1)return"دلوقتي";if(m<60)return"من "+m+" دقيقة";const h=Math.floor(m/60);return h<24?"من "+h+" ساعة":"من "+Math.floor(h/24)+" يوم"}
async function loadMe(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;return}
 const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();me=data}
async function feed(onlyMine){
 let q=sb.from("posts").select("id,room,body,created_at,user_id,profiles!posts_user_id_fkey(name,handle,gov),likes(user_id),comments(id,body,profiles(name))").order("created_at",{ascending:false}).limit(50);
 if(room!=="الكل"&&!onlyMine)q=q.eq("room",room);if(onlyMine)q=q.eq("user_id",me.id);
 const{data,error}=await q;return error?[]:data}
function post(p){const liked=p.likes.some(l=>l.user_id===me.id),pr=p.profiles||{};
 return`<div class="card" data-id="${p.id}"><div class="row"><div class="av">${esc((pr.name||"؟")[0])}</div><div><div class="nm">${esc(pr.name)}</div><div class="sub">@${esc(pr.handle)} · ${esc(pr.gov)} · ${ago(p.created_at)}</div></div></div>
 <div class="txt">${esc(p.body)}</div>${p.room!=="الكل"?`<span class="tag">${esc(p.room)}</span>`:""}
 <div class="acts"><button class="like ${liked?"on":""}">${liked?"❤️":"🤍"} ${p.likes.length}</button><button class="cmt">💬 ${p.comments.length}</button>${p.user_id===me.id?'<button class="del">🗑 احذف</button>':'<button class="rep">🚩 إبلاغ</button>'}</div>
 <div class="cms" hidden>${p.comments.map(c=>`<div class="cm"><b>${esc(c.profiles?.name)}:</b> ${esc(c.body)}</div>`).join("")}<div class="row" style="margin-top:8px"><input class="ci" maxlength="200" placeholder="اكتب تعليق..." style="margin:0"><button class="btn cs">ابعت</button></div></div></div>`}
function authView(){nav.hidden=true;
 app.innerHTML=`<div class="card"><h2 style="margin:0;color:var(--lapis)">${mode==="in"?"دخول":"حساب جديد"}</h2><div class="pat"></div>
 ${mode==="up"?'<input id="n" placeholder="اسمك" maxlength="30"><select id="g">'+GOVS.map(g=>`<option>${g}</option>`).join("")+"</select>":""}
 <input id="h" dir="ltr" placeholder="اسم المستخدم (إنجليزي)" maxlength="20" autocapitalize="none"><input id="p" type="password" placeholder="كلمة السر (6 حروف على الأقل)">
 <button class="btn" id="go">${mode==="in"?"دخول":"سجل"}</button> <button class="link" id="sw">${mode==="in"?"معنديش حساب":"عندي حساب"}</button><p class="err">${esc(msg)}</p></div>`;
 $("#sw").onclick=()=>{mode=mode==="in"?"up":"in";msg="";authView()};
 $("#go").onclick=async()=>{const h=$("#h").value.trim().toLowerCase(),p=$("#p").value;msg="";
  if(!/^[a-z0-9_]{3,20}$/.test(h)){msg="اسم المستخدم: إنجليزي وأرقام و _ (3 إلى 20)";return authView()}
  if(p.length<6){msg="كلمة السر قصيرة";return authView()}
  let r;if(mode==="up"){const n=$("#n").value.trim();if(n.length<2){msg="اكتب اسمك";return authView()}
   r=await sb.auth.signUp({email:mail(h),password:p,options:{data:{handle:h,name:n,gov:$("#g").value}}})}
  else r=await sb.auth.signInWithPassword({email:mail(h),password:p});
  if(r.error){msg=r.error.message.includes("already")?"اسم المستخدم مأخوذ":r.error.message.includes("Invalid login")?"بيانات غلط":"حصل خطأ، جرب تاني";return authView()}
  await loadMe();render()}}
async function render(){if(!me)return authView();nav.hidden=false;
 nav.innerHTML=[["home","🏠","الرئيسية"],["new","✍️","منشور"],["me","👤","أنا"]].map(([k,i,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${i}<br><small>${l}</small></button>`).join("");
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 if(tab==="new"){app.innerHTML=`<div class="card"><div class="nm">إيه الأخبار يا ${esc(me.name)}؟</div><br><textarea id="t" maxlength="500" placeholder="اكتب اللي في بالك..."></textarea><select id="r">${ROOMS.slice(1).map(r=>`<option>${r}</option>`).join("")}</select><button class="btn" id="pub">انشر</button><p class="err" id="e"></p></div>`;
  $("#pub").onclick=async()=>{const b=$("#t").value.trim();if(!b)return;const{error}=await sb.from("posts").insert({user_id:me.id,body:b,room:$("#r").value});if(error)$("#e").textContent="مقدرتش أنشر، جرب تاني";else{tab="home";room="الكل";render()}};return}
 app.innerHTML='<p class="sub">لحظة...</p>';
 const posts=await feed(tab==="me");
 const head=tab==="me"?`<div class="card"><div class="row"><div class="av">${esc(me.name[0])}</div><div><div class="nm">${esc(me.name)}</div><div class="sub">@${esc(me.handle)} · ${esc(me.gov)}</div></div></div><br><button class="btn" id="out">تسجيل خروج</button></div>`:`<div class="chips">${ROOMS.map(r=>`<button class="chip ${room===r?"on":""}" data-r="${r}">${r}</button>`).join("")}</div>`;
 app.innerHTML=head+(posts.map(post).join("")||'<p class="sub" style="text-align:center">مفيش منشورات لسه. كن أول واحد 👋</p>');
 $("#out")&&($("#out").onclick=async()=>{await sb.auth.signOut();me=null;render()});
 app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{room=c.dataset.r;render()});
 app.querySelectorAll(".card[data-id]").forEach(c=>{const id=+c.dataset.id,p=posts.find(x=>x.id===id);
  c.querySelector(".like").onclick=async()=>{p.likes.some(l=>l.user_id===me.id)?await sb.from("likes").delete().match({post_id:id,user_id:me.id}):await sb.from("likes").insert({post_id:id,user_id:me.id});render()};
  c.querySelector(".cmt").onclick=()=>{const x=c.querySelector(".cms");x.hidden=!x.hidden};
  c.querySelector(".cs").onclick=async()=>{const b=c.querySelector(".ci").value.trim();if(!b)return;await sb.from("comments").insert({post_id:id,user_id:me.id,body:b});render()};
  const d=c.querySelector(".del");if(d)d.onclick=async()=>{if(d.dataset.s){await sb.from("posts").delete().eq("id",id);render()}else{d.dataset.s=1;d.textContent="تأكيد الحذف؟"}};
  const r=c.querySelector(".rep");if(r)r.onclick=async()=>{await sb.from("reports").insert({post_id:id,user_id:me.id});r.textContent="تم الإبلاغ ✔";r.disabled=true}})}
await loadMe();render();
</script></body></html>
